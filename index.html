<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317261f'/%3E%3Cpath d='M25 6C9 4 4 12 9 21c7 8 17 1 16-15ZM7 27 22 9' fill='none' stroke='%23b9ca98' stroke-width='2'/%3E%3C/svg%3E">
  <title>世脉</title>
  <link rel="stylesheet" href="styles.css?v=5.3.1">
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19 3C8 2 3 7 5 14c2 7 13 7 14-11Z M5 21c2-7 6-11 11-15 M9 13l-1-5 M11 10l5 1"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8 M5 10v10h14V10 M10 20v-7h4v7"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3 M16 5a3 3 0 0 1 0 6 M18 15a5 5 0 0 1 3 5"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M8 22 16 2 M11 15c-5 0-7-3-6-6 4 0 6 2 6 6Z M13 10C9 9 7 6 9 3c3 1 5 3 4 7Z M13 11c4-4 7-3 8-1-1 3-4 5-9 5 M10 18c5-3 8-2 9 0-2 3-6 4-10 3"/></symbol>
    <symbol id="i-wood" viewBox="0 0 24 24"><path d="m12 2-7 9h4l-6 7h18l-6-7h4L12 2Z M12 18v4"/></symbol>
    <symbol id="i-stone" viewBox="0 0 24 24"><path d="m3 17 3-9 7-4 6 5 3 10-10 2-9-4Z M6 8l7 6 6-5 M13 14l-1 7"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 7h-4a3 3 0 0 0 0 6h2a2 2 0 0 1 0 4H9 M12 5v14"/></symbol>
    <symbol id="i-build" viewBox="0 0 24 24"><path d="m4 21 11-11 M13 6l5 5 4-4-5-5-4 4Z M3 6l3-3 4 4-3 3-4-4Z M10 13l8 8 3-3-8-8"/></symbol>
    <symbol id="i-policy" viewBox="0 0 24 24"><path d="M7 3h12v14a4 4 0 0 1-4 4H6a3 3 0 0 1 0-6h9v2a4 4 0 0 0 4 4 M7 15V6a3 3 0 0 0-6 0h6 M10 7h6 M10 11h6"/></symbol>
    <symbol id="i-reform" viewBox="0 0 24 24"><path d="M12 22V9 M12 15C5 16 2 12 3 7c6 0 9 3 9 8Z M12 11c0-7 4-10 9-9 0 6-3 9-9 9Z"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-3-1-6-2-10 1Zm0 0v15 M5 8l4 1 M5 12l4 1 M15 9l4-1 M15 13l4-1"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m16 7-2 7-7 3 3-7 6-3Z M12 0v3 M12 21v3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12 M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16 M4 12h16"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M3 12h17 M14 6l6 6-6 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 7h14 M5 12h10 M5 17h14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8V4Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14 M16 5v14"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M4 3h14l3 3v15H3V3h1Z M7 3v7h10V3 M7 21v-7h10v7"/></symbol>
    <symbol id="i-water" viewBox="0 0 24 24"><path d="M12 2C9 7 5 10 5 15a7 7 0 0 0 14 0c0-5-4-8-7-13Z M8 15a4 4 0 0 0 4 4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v3 M12 20v3 M1 12h3 M20 12h3 M4 4l2 2 M18 18l2 2 M20 4l-2 2 M6 18l-2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2c3 2 6 3 9 3v7c-1 5-4 8-9 10-5-2-8-5-9-10V5c3 0 6-1 9-3Z M12 7v10 M8 12h8"/></symbol>
    <symbol id="i-tower" viewBox="0 0 24 24"><path d="M4 3v5l3 3-1 11h12l-1-11 3-3V3h-4v3h-3V3h-3v3H7V3H4Z M10 22v-6h4v6"/></symbol>
    <symbol id="i-mill" viewBox="0 0 24 24"><path d="m9 12-2 10h10l-2-10 M12 10V2l4 3-4 5Zm0 0 8 1-3 4-5-5Zm0 0-2 8-4-3 6-5Zm0 0L4 8l3-4 5 6Z"/></symbol>
    <symbol id="i-warehouse" viewBox="0 0 24 24"><path d="m2 9 10-7 10 7 M4 8v14h16V8 M8 22V12h8v10 M8 16h8 M8 19h8"/></symbol>
    <symbol id="i-apartments" viewBox="0 0 24 24"><path d="M5 22V3h14v19 M2 22h20 M9 7h1 M14 7h1 M9 11h1 M14 11h1 M9 15h1 M14 15h1 M10 22v-4h4v4"/></symbol>
    <symbol id="i-health" viewBox="0 0 24 24"><path d="M4 22V7h16v15 M2 22h20 M9 7V2h6v5 M9 12h6 M12 9v6 M9 22v-4h6v4"/></symbol>
    <symbol id="i-industry" viewBox="0 0 24 24"><path d="M3 22V11l6-5v6l6-5v6h6v9H3Z M17 13V2h3l1 11 M7 17h1 M12 17h1 M17 17h1"/></symbol>
    <symbol id="i-rail" viewBox="0 0 24 24"><path d="M6 3h12v14H6V3Z M6 10h12 M9 6h6 M8 14h1 M15 14h1 M8 17 4 22 M16 17l4 5 M6 20h12"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path d="m2 8 10-6 10 6H2Z M4 21h16 M3 18h18 M6 10v7 M10 10v7 M14 10v7 M18 10v7"/></symbol>
    <symbol id="i-market" viewBox="0 0 24 24"><path d="M3 8h18l-2-5H5L3 8Z M4 8v13h16V8 M8 21v-8h8v8 M3 8c0 5 5 5 5 0 0 5 8 5 8 0 0 5 5 5 5 0"/></symbol>
    <symbol id="i-post" viewBox="0 0 24 24"><path d="M3 5h18v14H3V5Z m0 1 9 7 9-7 M3 19l6-6 M21 19l-6-6"/></symbol>
    <symbol id="i-culture" viewBox="0 0 24 24"><path d="M12 2v4 M8 6h8 M5 10l7-4 7 4 M6 11v8 M10 11v8 M14 11v8 M18 11v8 M3 22h18 M4 19h16"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="m3 6 5 5 4-8 4 8 5-5-3 13H6L3 6Z M6 22h12"/></symbol>
    <symbol id="i-war" viewBox="0 0 24 24"><path d="m3 3 5 1 12 15 M21 3l-5 1L4 19 M4 14l6 6 M14 20l6-6 M3 21l3-3 M18 18l3 3"/></symbol>
  </defs></svg>

  <main id="game" aria-label="文明世界">
    <canvas id="worldMap" aria-label="可拖动和缩放的世界地图"></canvas>
    <div class="world-vignette" aria-hidden="true"></div>

    <header id="hud" class="hud hidden">
      <div class="identity glass">
        <button id="menuButton" class="brand-button" title="存档与菜单" aria-label="存档与菜单"><svg><use href="#i-leaf"/></svg></button>
        <div><strong id="settlementName">溪岸</strong><span id="stageLabel">河畔营地</span></div>
      </div>
      <div class="resources glass" aria-label="聚落资源">
        <button class="resource" data-stat="population" title="人口与住房"><svg><use href="#i-people"/></svg><span><b id="populationValue">36</b><small>人口</small></span></button>
        <button class="resource" data-stat="food" title="粮食收支"><svg><use href="#i-food"/></svg><span><b id="foodValue">120</b><small>粮食</small></span></button>
        <button class="resource" data-stat="wood" title="木材收支"><svg><use href="#i-wood"/></svg><span><b id="woodValue">100</b><small>木材</small></span></button>
        <button class="resource" data-stat="stone" title="石材收支"><svg><use href="#i-stone"/></svg><span><b id="stoneValue">48</b><small>石材</small></span></button>
        <button class="resource hidden" data-stat="treasury" title="国库与预算"><svg><use href="#i-coin"/></svg><span><b id="treasuryValue">0</b><small>国库</small></span></button>
        <button class="resource warehouse-button" data-panel="warehouse" title="仓库" aria-label="仓库"><svg><use href="#i-warehouse"/></svg></button>
      </div>
      <nav class="toolbar glass" aria-label="治理操作">
        <button class="tool-button" data-panel="build" title="建设 B"><svg><use href="#i-build"/></svg><span>建设</span></button>
        <button class="tool-button" data-panel="policy" title="政策 P"><svg><use href="#i-policy"/></svg><span>政策</span></button>
        <button class="tool-button" data-panel="reform" title="制度"><svg><use href="#i-reform"/></svg><span>制度</span></button>
        <button class="tool-button" data-panel="report" title="报告 R"><svg><use href="#i-report"/></svg><span>报告</span><i id="reportBadge" class="badge hidden"></i></button>
        <button id="exploreButton" class="tool-button" title="探索 E"><svg><use href="#i-compass"/></svg><span>探索</span></button>
        <button class="tool-button" data-panel="automation" title="委托建设"><svg><use href="#i-build"/></svg><span>委托</span></button>
        <button class="tool-button" data-panel="hostile" title="周边势力"><svg><use href="#i-compass"/></svg><span>势力</span></button>
      </nav>
    </header>

    <div id="mapContext" class="map-context hidden"><span class="eyebrow" id="mapLevelLabel">聚落近景</span><p id="mapSubtitle">溪岸 · 河谷平原</p></div>
    <aside id="detailPanel" class="detail-panel glass hidden" aria-label="所选项目详情"></aside>

    <div id="mapControls" class="map-controls hidden">
      <div class="view-levels glass" aria-label="地图层级"><button data-level="world" title="世界地图">世界</button><button data-level="region" title="地区地图">地区</button><button data-level="village" class="active" title="查看每间房屋">聚落</button></div>
      <div class="zoom-controls glass"><button id="zoomOut" title="缩小" aria-label="缩小"><svg><use href="#i-minus"/></svg></button><button id="homeView" title="回到聚落" aria-label="回到聚落"><svg><use href="#i-home"/></svg></button><button id="zoomIn" title="放大" aria-label="放大"><svg><use href="#i-plus"/></svg></button></div>
      <div class="map-scale"><span></span><small id="scaleLabel">100 m</small></div>
    </div>

    <div id="timeControls" class="time-controls glass hidden">
      <div class="calendar"><strong id="yearLabel">纪元 0 年</strong><span id="seasonLabel">暂停</span></div>
      <button id="playButton" class="play-button" title="开始 / 暂停 空格" aria-label="开始时间"><svg><use id="playUse" href="#i-play"/></svg></button>
      <div class="speed-options" aria-label="时间速度"><button data-speed="1" class="active">1×</button><button data-speed="5">5×</button><button data-speed="12">12×</button></div>
    </div>

    <div id="importantEventBackdrop" class="important-event-backdrop hidden" aria-hidden="true"></div>
    <section id="eventPopup" class="event-popup glass hidden" aria-live="polite"></section>
    <div id="onboarding" class="onboarding glass hidden"><span class="guide-mark">01</span><div><strong id="guideTitle">先看看这处河湾</strong><p id="guideText">拖动画面，滚轮靠近屋舍。点击顶部的建设，种下第一片农田。</p></div><button id="dismissGuide" class="icon-button" title="关闭提示" aria-label="关闭提示"><svg><use href="#i-close"/></svg></button></div>
    <div id="placementBar" class="placement-bar glass hidden"><svg><use href="#i-build"/></svg><span id="placementText"></span><button id="cancelPlacement" class="icon-button" title="取消放置" aria-label="取消放置"><svg><use href="#i-close"/></svg></button></div>
    <div id="toastRegion" class="toast hidden" role="status"></div>
  </main>

  <section id="startScreen" class="start-screen" aria-label="启动界面">
    <div class="start-shade"></div>
    <div class="start-content"><h1 aria-label="世脉"><span class="title-first">世</span><span class="title-second">脉</span></h1>
      <div class="start-actions"><button id="continueButton" class="continue-button hidden"><span><small>继续游戏</small><strong id="continueName"></strong><em id="continueMeta"></em></span><svg><use href="#i-arrow"/></svg></button><button id="newGameButton" class="new-game-button"><span>新的世界</span><svg><use href="#i-arrow"/></svg></button><button id="loadGameButton" class="load-button"><svg><use href="#i-save"/></svg><span>读取存档</span><small id="saveCount">0</small></button></div>
    </div>
  </section>

  <div id="dialogBackdrop" class="dialog-backdrop hidden"><section id="dialog" class="dialog glass" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></section></div>
  <script src="terrain.js?v=5.3.1"></script><script src="society.js?v=5.3.1"></script><script src="warfare.js?v=5.3.1"></script><script src="logistics.js?v=5.3.1"></script><script src="minerals.js?v=5.3.1"></script><script src="economy.js?v=5.3.1"></script><script src="politics.js?v=5.3.1"></script><script src="territory.js?v=5.3.1"></script><script src="nations.js?v=5.3.1"></script><script src="engine.js?v=5.3.1"></script><script src="world.js?v=5.3.1"></script><script src="storage.js?v=5.3.1"></script><script src="app.js?v=5.3.1"></script>
</body>
</html>
